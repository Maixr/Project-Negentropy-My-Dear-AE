#Structure marker value calculation
[structureValue]
	# Default: 1.0
	# Range: 0.0 ~ 1.7976931348623157E308
	commonRarityMultiplier = 1.0
	# Default: 5.0
	# Range: 0.0 ~ 1.7976931348623157E308
	uncommonRarityMultiplier = 5.0
	# Default: 10.0
	# Range: 0.0 ~ 1.7976931348623157E308
	rareRarityMultiplier = 10.0
	# Default: 50.0
	# Range: 0.0 ~ 1.7976931348623157E308
	epicRarityMultiplier = 50.0
	#Per-item expectation method
	#EXACT_THEN_SAMPLING prefers exact analysis and falls back to Monte Carlo
	#SAMPLING always uses Monte Carlo
	#Allowed Values: EXACT_THEN_SAMPLING, SAMPLING
	itemExpectationMethod = "EXACT_THEN_SAMPLING"
	#Monte Carlo samples per loot table
	# Default: 1000
	# Range: 1 ~ 1000000
	samplingCount = 1000
	#Supplemental Monte Carlo draws used to observe items injected
	#by Forge global loot modifiers into an otherwise exactly
	#analyzed table. Only runs when a modifier targets the table
	#or a runtime probe detects an injection.
	# Default: 64
	# Range: 1 ~ 1000000
	glmSupplementSamples = 64
	#Detached structure-generation samples used by catalogue analysis
	# Default: 8
	# Range: 1 ~ 64
	virtualStructureSamples = 8
	#Maximum catalogue-analysis work units processed each server tick
	# Default: 1
	# Range: 1 ~ 64
	virtualStructureStepsPerTick = 1
	#Wall-clock slice detached structure sampling may use per server tick before it yields and is resumed on the next tick; this is the knob that bounds tick latency
	#The slice is checked between structure chunks, so one tick can overshoot by the cost of a single chunk; virtualStructureSampleBudgetMillis caps that overshoot. Raising this trades tick latency for faster analysis.
	# Default: 20
	# Range: 1 ~ 1000
	virtualStructureSampleSliceMillis = 20
	#Total work budget for one detached structure sample (time spent inside the sample, not wall-clock)
	#A sample that needs more is reported as UNSUPPORTED with a VIRTUAL_SAMPLE_BUDGET diagnostic instead of running away; raise this to analyse very large modded structures, lower it to tighten the worst-case single-chunk overshoot.
	# Default: 5000
	# Range: 10 ~ 600000
	virtualStructureSampleBudgetMillis = 5000
	#Dimension value entries in dimension_id=value format
	#Dimensions not listed here use 1.0
	dimensionValues = ["minecraft:overworld=1.0", "minecraft:the_nether=10.0", "minecraft:the_end=20.0", "allthemodium:the_other=100.0", "bloodmagic:dungeon=100.0"]
	#Per-item rarity multiplier overrides in regex=value format
	#Regexes are matched against the complete item ID
	#Items not matched here use their rarity multiplier above
	itemMultipliers = ["iron=2.0", "gold=5.0", "diamond=10.0", "netherite=20.0", "allthemodium_=50.0", "vibranium_=100.0", "unobtainium_=500.0", "upgrade_smithing_template=50.0"]
	#Allowed dimension ID regexes
	#Entries are regular expressions matched against complete IDs
	dimensionWhitelist = []
	#Denied dimension ID regexes
	#Entries are regular expressions matched against complete IDs
	dimensionBlacklist = []
	#Allowed structure ID regexes
	#Entries are regular expressions matched against complete IDs
	structureWhitelist = []
	#Denied structure ID regexes
	#Entries are regular expressions matched against complete IDs
	structureBlacklist = []
	#Allowed item ID regexes
	#Entries are regular expressions matched against complete IDs
	itemWhitelist = []
	#Denied item ID regexes
	#Entries are regular expressions matched against complete IDs
	itemBlacklist = []
