#Enable RTS Home anchors and home-radius limits.
enableSurvivalProgression = false
#When RTS Home is enabled, share RTS home anchors and team plugins with the player's FTB Team, OpenPAC party, or vanilla scoreboard team.
shareSurvivalProgressionWithTeams = false
#Maximum RTS action radius in blocks.
# Default: 128
# Range: 48 ~ 512
maxActionRadiusBlocks = 128
#Enable the RTS blueprint library tab, local blueprint upload, and server-side blueprint placement.
enableBlueprints = true
#Maximum non-air blocks allowed in one RTS blueprint import, capture, or placement job.
# Default: 20000
# Range: 1 ~ 200000
maxBlueprintBlocks = 20000

[diagnostics]
	#RTS operation diagnostics. VERBOSE adds one-second task progress samples; gameplay is unchanged.
	#Allowed Values: OFF, BASIC, VERBOSE
	level = "BASIC"
	# Default: 1024
	# Range: > 1
	maxTraces = 1024
	# Default: 2048
	# Range: > 1
	maxWorkflowLinks = 2048
	# Default: 2048
	# Range: > 1
	maxTaskLinks = 2048

[mining]
	#Maximum blocks collected by one RTS chain mining request.
	# Default: 256
	# Range: 1 ~ 4096
	ultimineMaxBlocks = 256
	#旧版尺寸键，仅用于首次迁移；有效上限请修改 mining.maxSelectionVolume。
	# Default: 0
	# Range: 0 ~ 256
	areaMineMaxSize = 0
	#旧版体积键，仅用于首次迁移；有效上限请修改 mining.maxSelectionVolume。
	# Default: 0
	# Range: 0 ~ 262144
	areaMineMaxVolume = 0
	#旧版宽度键，仅用于首次迁移；不再施加独立轴长限制。
	# Default: 0
	# Range: 0 ~ 262144
	areaMineMaxWidth = 0
	#旧版高度键，仅用于首次迁移；不再施加独立轴长限制。
	# Default: 0
	# Range: 0 ~ 262144
	areaMineMaxHeight = 0
	#旧版深度键，仅用于首次迁移；不再施加独立轴长限制。
	# Default: 0
	# Range: 0 ~ 262144
	areaMineMaxDepth = 0
	#范围挖掘／破坏的唯一选区体积上限（含端点的宽×高×深），有效范围 1..262144。
	# Default: 46656
	# Range: 1 ~ 262144
	maxSelectionVolume = 46656
	#Maximum X-axis span of a range selection, measured in world coordinates.
	# Default: 64
	# Range: > 1
	maxSelectionSizeX = 64
	#Maximum Y-axis span of a range selection, measured in world coordinates.
	# Default: 64
	# Range: > 1
	maxSelectionSizeY = 64
	#Maximum Z-axis span of a range selection, measured in world coordinates.
	# Default: 64
	# Range: > 1
	maxSelectionSizeZ = 64
	#Server ceiling for harvest-tier plugins used by non-chain RTS range mining.
	#Allowed Values: STONE, IRON, DIAMOND, UNLIMITED
	areaMineMaxHarvestTier = "UNLIMITED"
	#Maximum connected tree blocks for convenience tree destruction.
	# Default: 8192
	# Range: 1 ~ 262144
	maxTreeBlocks = 8192
	#旧版目标数量键，仅用于首次迁移；有效上限请修改 mining.maxSelectionVolume。
	# Default: 0
	# Range: 0 ~ 262144
	areaDestroyMaxTargets = 0
	#Maximum queued mining targets processed by one mining task slice.
	# Default: 32
	# Range: > 1
	ultimineBlocksPerTick = 32
	#Radius used to absorb drops around remotely mined blocks.
	# Default: 1.25
	# Range: 0.25 ~ 8.0
	dropScanRadius = 1.25

[progression]
	#RTS Home selection radius in blocks.
	# Default: 34
	# Range: > 1
	homeSelectionRadiusBlocks = 34
	#RTS Home relocation cooldown in days; zero disables the cooldown.
	# Default: 20
	# Range: > 0
	homeRelocationCooldownDays = 20

[building]
	#Maximum generated building shape dimension.
	# Default: 32
	# Range: > 1
	maxShapeDimension = 32
	#Maximum generated building shape radius.
	# Default: 32
	# Range: > 1
	maxShapeRadius = 32

[smartFill]
	#Maximum smart-fill block count.
	# Default: 1024
	# Range: 1 ~ 8192
	maxBlocks = 1024
	#Default smart-fill block count.
	# Default: 512
	# Range: 1 ~ 8192
	defaultBlocks = 512
	#Maximum smart-fill diameter.
	# Default: 32
	# Range: 3 ~ 256
	maxDiameter = 32
	#Default smart-fill diameter.
	# Default: 16
	# Range: 3 ~ 256
	defaultDiameter = 16

[storage]
	#Maximum volume of one batch storage binding selection.
	# Default: 262144
	# Range: 1 ~ 262144
	maxBatchBindingSelectionVolume = 262144
	#Maximum X span of one batch storage binding selection.
	# Default: 64
	# Range: > 1
	maxBatchBindingSizeX = 64
	#Maximum Y span of one batch storage binding selection.
	# Default: 64
	# Range: > 1
	maxBatchBindingSizeY = 64
	#Maximum Z span of one batch storage binding selection.
	# Default: 64
	# Range: > 1
	maxBatchBindingSizeZ = 64
	# Default: 4096
	# Range: > 1
	dropCacheSoftCapacity = 4096
	#Number of storage cache refresh cycles between expensive AE2 network snapshots.
	# Default: 10
	# Range: > 1
	ae2NetworkRefreshThrottle = 10
	#Number of storage cache refresh cycles between expensive Refined Storage network snapshots.
	# Default: 10
	# Range: > 1
	refinedStorageNetworkRefreshThrottle = 10
	#Maximum linked storage endpoints retained for one player. Batch linking deduplicates endpoints from the same AE2 or Refined Storage network.
	# Default: 200
	# Range: 1 ~ 4096
	maxLinkedStorages = 200
	#Allow the cross-dimension storage plugin to wake and access linked storage in other dimensions.
	enableCrossDimensionStorage = true
	#Maximum short-lived cross-dimension storage chunk tickets retained for one player.
	# Default: 32
	# Range: 1 ~ 256
	maxCrossDimensionAwakeChunks = 32
	#Maximum player count retained by the storage page LRU cache.
	# Default: 256
	# Range: > 1
	pageCacheMaxPlayers = 256
	#Default number of item/fluid entries shown per RTS storage page.
	# Default: 90
	# Range: 1 ~ 4096
	defaultStoragePageSize = 90
	#Maximum allowed item/fluid entries per RTS storage page request.
	# Default: 180
	# Range: 1 ~ 8192
	maxStoragePageSize = 180

[funnel]
	#Funnel pickup radius in blocks.
	# Default: 2.0
	# Range: 0.0 ~ 32.0
	pickupRadiusBlocks = 2.0
	# Default: 24
	# Range: > 1
	maxEntitiesPerTick = 24
	# Default: 48
	# Range: > 1
	maxItemsPerTick = 48
	# Default: 16
	# Range: > 1
	bufferMaxStacks = 16
	# Default: 2
	# Range: > 1
	tickInterval = 2

[workflows]
	#Maximum active workflows per player.
	# Default: 8
	# Range: 1 ~ 1024
	maxActivePerPlayer = 8

[history]
	#Maximum undo history entries retained per stack.
	# Default: 3
	# Range: > 1
	maxEntriesPerStack = 3
	#Undo history retention time in seconds.
	# Default: 600
	# Range: > 1
	retentionSeconds = 600

[placement]
	#Maximum queued remote placement targets processed per player per server tick.
	# Default: 64
	# Range: > 1
	buildBatchBlocksPerTick = 64
	#Maximum queued quick-build placement jobs per player.
	# Default: 4
	# Range: > 1
	buildBatchMaxQueuedJobs = 4
	#Maximum RTS remote block action sounds sent per player per tick. Excess sounds are dropped.
	# Default: 16
	# Range: 0 ~ 16
	remoteBlockActionSoundsPerTick = 16

[taskEngine]
	#Hard global RTS work-unit limit across all players in one server tick.
	# Default: 256
	# Range: > 1
	maxUnitsPerTick = 256
	#Maximum RTS work units granted to one player before rotating to another player.
	# Default: 32
	# Range: > 1
	maxUnitsPerSlice = 32
	#Cooperative RTS main-thread time budget per server tick in nanoseconds.
	# Default: 8000000
	# Range: 1 ~ 9223372036854775807
	maxNanosPerTick = 8000000

[interaction]
	#Temporary interaction reach used while RTSBuilding replays a remote player action.
	# Default: 4.0
	# Range: 1.0 ~ 16.0
	remotePovBlockReach = 4.0

[fluid]
	#Fallback internal fluid buffer capacity in buckets when progression data is unavailable.
	# Default: 100
	# Range: 1 ~ 4096
	internalFluidCapacityBuckets = 100

[internal]
	#Internal RTSBuilding server configuration migration revision. Do not edit manually.
	# Default: 0
	# Range: > 0
	configRevision = 1
