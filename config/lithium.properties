# ============ 2026-09-30 修改说明 ============
# 原因：与 dimensionalripper 的 @Redirect 冲突，导致游戏启动崩溃。
#
# 冲突点：Entity#getEntityCollisions(Level, Entity, AABB) 被两个模组同时 @Redirect：
#   - lithium.mixins.json:entity.collisions.movement.EntityMixin
#       -> @Redirect::postponeGetEntities          (priority 1000)
#   - dimensionalripper.mixins.json:EntityGetEntityCollisionsMixin
#       -> @Redirect::modzuozhi_noMobCollision     (priority 1000)
#
# 双方 priority 相同，dimensionalripper 先注册成功，lithium 的注入被跳过；
# 而 lithium.mixins.json 声明 required=true、injectors.defaultRequire=1，
# 注入失败即抛 InjectionError，游戏在启动阶段直接崩溃。
#
# 处理：单独关闭这一项优化，两个模组即可共存。
# 代价：仅失去「实体碰撞检测」这一项优化，其余 147 项 Lithium 优化全部保留。
# 如需恢复：把下面这行改成 mixin.entity.collisions.movement=true
mixin.entity.collisions.movement=false

# ============ 2026-09-30 第二处冲突 ============
# 解决第一处后暴露出来的：
#
# dimensionalripper.mixins.json:LevelGetChunkMixin
#   -> @Redirect::modzuozhi_getRealChunk
#   目标 Level::getChunk(II)
#
# 但该方法已被 lithium 抢先 merge：
#   lithium.mixin.world.chunk_access.LevelMixin (priority 1000)
# 导致 dimensionalripper 无法注入，抛 MixinApplyError（FATAL）。
#
# 已确认：没有任何 mixin 依赖 world.chunk_access，可单独关闭。
# 代价：失去「区块访问路径」优化。
mixin.world.chunk_access=false
