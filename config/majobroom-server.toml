#Flight Settings
[flight]
	#Max Horizontal Speed (blocks/tick) (Acceleration also needed to change)
	# Default: 0.9
	# Range: 0.3 ~ 2.0
	maxSpeed = 0.9
	#Horizontal Acceleration
	# Default: 0.08
	# Range: 0.04 ~ 0.1
	acceleration = 0.08
	#Max Vertical Speed (blocks/tick）
	# Default: 0.5
	# Range: 0.1 ~ 2.0
	maxVerticalSpeed = 0.5
	#Vertical Acceleration
	# Default: 0.05
	# Range: 0.001 ~ 0.5
	verticalAcceleration = 0.05
	#Momentum (Larger will make broom stop faster)
	# Default: 0.92
	# Range: 0.5 ~ 0.99
	momentum = 0.92
	#Ground Check Offset (blocks)
	# Default: 0.02
	# Range: 0.0 ~ 0.1
	groundCheckOffset = 0.02
	#Ground Repulsion (The force of ground pushing the broom back)
	# Default: 0.005
	# Range: 0.0 ~ 0.1
	groundRepulsion = 0.005
	#No Armor Speed Penalty (1.0 means no penalty, 0.6 means speed reduced to 60%)
	# Default: 0.38
	# Range: 0.1 ~ 1.0
	noArmorSpeedPenalty = 0.38

#Majo Armor Settings
[armor]
	#Whether to enable Majo armor stat enhancement (including iron's spellbooks attributes)
	armorOverpower = false
	#Whether to enable Majo armor to not take damage
	armorImmortal = true
	#Whether to make Majo armor invisible when the wearer has invisibility effect
	armorInvisible = false
	#Whether to enable armor bless
	#(which is a series of effect and enhancement provided to players(and entities) who wear full Majo armor.)
	armorBless = false
	#Effects given to blessed entity
	#Due to some problem, you must set value in pattern like "{namespace}:{effect_name}:{level}"
	#i.e. minecraft:speed:2
	blessEffectList = ["majobroom:decrease_damage:3"]
	#Whether a blessed entity is allowed to be immune to projectiles.
	# Immune projectiles will pass directly through the entity.
	blessImmuneProjectile = false
	#use bless_immune_projectile_list as whitelist
	blessImmuneProjectileWhitelist = false
	blessImmuneProjectileList = []
	#Whether to prevent monsters from targeting entities wearing full Majo armor while invisible
	vanishToMonster = false
