[Basic]
	#进入主题梦境《灯影之下》时是否给予苍白骨针 默认：false
	"in lamp shadow give pale boneneedle" = true
	#初始生成世界时在0,0原点生成染梦裂隙 默认：false
	"the origin of the world initially generated dyedream crack " = true
	#启用模组进入游戏时的聊天栏公告 默认：true
	"mod accouocement" = true
	#首次登录是否赠送《帕斯特指南》Patchouli 图鉴（需安装 Patchouli 才生效） 默认：true
	"give guide book" = true
	#禁止在使用染梦世界的染梦裂隙向主世界的返程传送 默认：false
	"no return dyedream crack" = false
	#在染梦世界生成初始出生点岛屿 默认：true
	"dyedream origin spawnpoint" = true
	#在与无名第三次对话后会被强制传送回主世界 默认：true
	"shadow npc third dialogue after tp player back to overworld" = true

["Custom Spawn"]
	#自定义出生维度/群系总开关（开启后，新玩家首次进入世界时会在指定维度与群系出生；关闭后按原版逻辑在主世界出生） 默认：false
	"custom spawn enabled" = false
	#自定义出生维度 ID（格式：命名空间:路径，如 minecraft:overworld / pasterdream:dyedream_world） 默认：minecraft:overworld
	"custom spawn dimension" = "minecraft:overworld"
	#自定义出生群系 ID（格式：命名空间:路径，如 minecraft:plains / pasterdream:dyedream） 默认：minecraft:plains
	"custom spawn biome" = "minecraft:plains"
	#出生群系搜索半径，单位：格（以目标维度出生点为中心向外搜索配置的群系；搜索不到时回退到维度出生点） 默认：10000 范围：100~100000
	# Default: 10000
	# Range: 100 ~ 100000
	"custom spawn search radius" = 10000

[property]
	#pasterdream玩家刻功能程序更新频率，算法：每-[此配置单位时间]-进行一次更新 单位/tick，过快的更新频率可能会影响性能，过慢的频率会让部分功能显得非常迟钝，推荐频率范围[2~20]整数  默认：5
	# Default: 5
	# Range: 2 ~ 20
	"player total tick update" = 5

[Sky]
	#星空枕(memento_item_08)在天空上可创建的连线星体数量上限 默认：8 范围：1~64
	# Default: 8
	# Range: 1 ~ 64
	"skylink max stars" = 8

["Meltdream Chest"]
	#融梦水晶箱自定义战利品总开关（开启后按下方三个品质物品池生成掉落，逐条容错，全无效则用内置兜底池；关闭时使用原版战利品表） 默认：false
	"meltdream chest custom loot enabled" = false
	#融梦水晶箱普通品质物品池（每行一个条目，格式：物品ID 数量 权重，如 "pasterdream:dyedream_ingot 1 10"） 默认：空（留空或全无效时用内置兜底池）
	"meltdream chest common loot" = []
	#融梦水晶箱稀有品质物品池（格式同上） 默认：空
	"meltdream chest rare loot" = []
	#融梦水晶箱传说品质物品池（格式同上） 默认：空
	"meltdream chest legendary loot" = []

[Ban]
	#关闭并禁止所有翅膀的功能  默认：false
	"ban all the wings" = false
	#关闭并禁止大地之刃的功能  默认：false
	"ban terra sword" = false
	#关闭并禁止业火项链的功能  默认：false
	"ban fire necklace" = false
	#关闭并禁止时之沙的功能  默认：false
	"ban time hourglass" = false

["Spawn Cap"]
	#发光鱿鱼刷新上限总开关（开启后，染梦维度内玩家模拟距离范围内的发光鱿鱼数量达到上限时不再自然刷新） 默认：true
	"glow squid spawn cap enabled" = true
	#染梦维度内，单个玩家模拟距离范围内允许存在的非持久化发光鱿鱼数量上限 默认：16 范围：1~128
	# Default: 16
	# Range: 1 ~ 128
	"glow squid spawn cap" = 16

[Debug]
	#调试日志总开关 默认：false（关闭后不输出任何调试/诊断日志）
	"enable debug log" = false
	#启用 PasterDreamAPI 模块的调试日志 默认：false
	"enable api debug log" = false
	#启用 PasterDream 主模块的调试日志 默认：false
	"enable main debug log" = false
	#启用 Smoketest / 移植验证的调试日志 默认：false
	"enable smoketest debug log" = false

["Aaroncos Arena"]
	#亚伦柯斯竞技场遗迹感染总开关（开启后：主世界竞技场遗迹生成时会在其周围刷写竞技场群系并启动持续感染，感染限制在竞技场群系范围内，击败竞技场BOSS后感染退化、群系还原；关闭后：不刷群系、不启动感染，已有存档的感染会在服务器启动时被强制停止并自动清理。竞技场遗迹结构本身不受此开关影响，仍会在主世界正常生成一次） 默认：false
	"arena ruin infection enabled" = false

["Save Compat"]
	#加载旧版本存档时提示备份与更新（关闭后不检测、不提示、不备份） 默认：true
	"save compat enabled" = true
	#检测到旧版本存档时自动备份到游戏目录 backups/（备份在服务器启动阶段执行） 默认：true
	"save compat auto backup" = true
