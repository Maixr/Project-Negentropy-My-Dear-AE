#Dry basic-planter cycle, in game ticks (20 ticks = 1 second). Restart the world after changing production settings.
# Default: 200
# Range: 20 ~ 1200000
earlyCycleTicks = 200
#Watered basic-planter cycle in ticks. Provider-defined planting recipes retain their own cycle rules.
# Default: 100
# Range: 20 ~ 1200000
wateredCycleTicks = 100
#Water consumed for one accelerated basic-planter harvest, in mB.
# Default: 100
# Range: 1 ~ 16000
waterPerHarvestMb = 100
#Work per network harvest in ticks, before speed and occupied parallelism. Data-pack and explicit provider recipes can override it.
# Default: 200
# Range: 20 ~ 1200000
networkCycleTicks = 200
#AE/t for one occupied seed at base speed, per running crop; not FE/t.
# Default: 4.0
# Range: 0.01 ~ 1000000.0
aePerCropPerTick = 4.0
#Per-crop seed capacity with four parallel modules. Empty capacity produces nothing.
# Default: 256
# Range: 256 ~ 65536
maximumParallel = 256
#Speed multiplier with four speed modules. Intermediate module counts follow the existing curved progression.
# Default: 256
# Range: 256 ~ 65536
maximumSpeedMultiplier = 256
#AE/t per fully occupied, fully upgraded crop before actual batch/output limits. Running crops add their costs.
# Default: 5000.0
# Range: 0.01 ~ 1000000.0
fullUpgradeAePerCropPerTick = 5000.0
#Base ME infusion work in ticks, before acceleration cards. Restart the world to apply production changes.
# Default: 100
# Range: 20 ~ 1200000
altarCycleTicks = 100
#Additional biological essence outputs: entity_id=item_id,item_id. Empty by default. Restart the world to rebuild cached loot recipes.
bioLootAdditions = []
#Species tint overrides: entity_id=RRGGBB,RRGGBB (two hexadecimal colors). Empty uses existing spawn-egg colors. Restart the world to rebuild color caches.
bioColors = []
#Extra-seed probability per harvest only when the native/provider route cannot reproduce. 0 disables, 1 guarantees one extra seed. Default 0.10 preserves existing behavior.
# Default: 0.1
# Range: 0.0 ~ 1.0
fallbackSeedChance = 0.1
#Base ME biological seed work, in ticks. Four acceleration cards each double work and active power.
# Default: 200
# Range: 20 ~ 1200000
meBioCycleTicks = 200
#AE per work tick for the ME biological cultivator. Base 4 AE/t, speed cards multiply active AE/t.
# Default: 4.0
# Range: 0.01 ~ 1000000.0
meBioAePerTick = 4.0
