#Speed multipliers for tiered CMM modules in Mekanical-Create.
[mekanicalcreate]

	[mekanicalcreate.press]
		#Processing multiplier for CMM brass press modules.
		# Default: 1
		# Range: 1 ~ 64
		brass = 1
		#Processing multiplier for CMM netherite press modules.
		# Default: 2
		# Range: 1 ~ 64
		netherite = 2
		#Processing multiplier for CMM end press modules.
		# Default: 3
		# Range: 1 ~ 64
		end = 3
		#Processing multiplier for CMM beyond press modules.
		# Default: 4
		# Range: 1 ~ 64
		beyond = 4
		#Processing multiplier for CMM creative press modules.
		# Default: 4
		# Range: 1 ~ 64
		creative = 4

	[mekanicalcreate.deployer]
