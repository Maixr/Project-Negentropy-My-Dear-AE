#Base factor for working out machine performance with upgrades - UpgradeModifier * (UpgradesInstalled/UpgradesPossible).
# Default: 20
# Range: > 1
maxUpgradeMultiplier = 20
#Maximum number of Speed/Energy upgrades a machine can accept (8-32, default 16). Also controls the Empowered Speed/Energy upgrade maximum and their unlock requirement.
# Default: 16
# Range: 8 ~ 32
maxUpgrades = 16
#Allow Meka Armor/Tool to be enchanted. You need to add the items to the enchantable tags yourself.
enchantableMekaGear = false

#Configurable Auto Inserter
[AutoInsert]
	#Configurable item rate for Auto Inserter
	# Default: 8
	# Range: 1 ~ 64
	itemRate = 8
	#Configurable chemical rate for Auto Inserter
	# Default: 128
	# Range: 1 ~ 9223372036854775807
	chemicalRate = 128
	#Configurable fluid rate for Auto Inserter
	# Default: 128
	# Range: > 1
	fluidRate = 128
	#Configurable energy rate for Auto Inserter
	# Default: 128
	# Range: 1 ~ 9223372036854775807
	energyRate = 128
