#Aggregated crafting-plan optimizer. SAFE deduplicates deterministic recipe trees;
#every branch it cannot prove equivalent is handed back to AE2. OFF disables it entirely.
#Allowed Values: OFF, SAFE
max_fast_mode = "SAFE"
#Maximum unique recipe-tree nodes compiled by the optimizer before falling back to AE2.
# Default: 8192
# Range: 64 ~ 65536
max_fast_max_nodes = 8192
#Maximum graph compilation time in milliseconds before the optimizer falls back to AE2.
# Default: 100
# Range: 1 ~ 5000
max_fast_compile_budget_ms = 100
#Dispatch several repetitions of one recipe to the fantasy annihilation block in a single
#push. Throughput is unchanged - the crafting CPU still spends one operation per craft -
#but the per-craft inventory walk is done once instead of N times.
batch_dispatch_enabled = true
#Log why the optimizer aggregated or fell back on each crafting calculation.
diagnostics = false
