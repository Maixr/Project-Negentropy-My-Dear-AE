#样板缓存槽位数。最少 18，之后按 9 递增（一行 9 格）。下次打开终端生效。
# Default: 36
# Range: 18 ~ 576
patternCacheSlots = 36
#垃圾桶槽位数。最少 27（3×9），按 9 递增。下次打开终端生效。
# Default: 576
# Range: 27 ~ 576
trashSlots = 576
#工具包槽位数。最少 18（2×9），按 9 递增。只存放不可堆叠物品。下次打开终端生效。
# Default: 27
# Range: 18 ~ 576
toolkitSlots = 27
#网络工具包升级槽位数。最少 9（3×3），按 9 递增。下次打开界面生效。
# Default: 27
# Range: 9 ~ 216
networkToolkitSlots = 27
