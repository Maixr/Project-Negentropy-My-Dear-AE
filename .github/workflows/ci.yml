name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: 校验整合包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: pack / index / 模组元数据
        run: node scripts/verify-pack.mjs

      - name: KubeJS 脚本语法
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! node --check "$f" 2>/tmp/e; then
              echo "::error file=$f::KubeJS 脚本语法错误: $(tr '\n' ' ' < /tmp/e)"
              fail=1
            fi
          done < <(find kubejs -name '*.js' -not -path '*/_deleted*' -print0)
          exit $fail

      - name: JSON 可解析（容忍 JSONC 注释）
        run: node scripts/check-json.mjs

      - name: 没有超限归档
        run: |
          found=$(find . -path ./.git -prune -o -type f \( -name '*.jar' -o -name '*.zip' \) -size +100M -print)
          if [ -n "$found" ]; then
            echo "::error::发现超过 100MB 的归档文件: $found"
            exit 1
          fi
